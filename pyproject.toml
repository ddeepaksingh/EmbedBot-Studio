[project]
name = "django-embed-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "django>=6.1.3",
    "django-cors-headers>=4.9.0",
    "google-genai>=3.4.0",
    "openai>=3.52.0",
    "requests>=2.34.2",
]

[project.scripts]
django-embed-bot = "django_embed_bot:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
